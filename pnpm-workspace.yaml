packages:
  - backend
  - frontend

# pnpm 11+ は依存の build script を既定で deny する。postinstall を持つものだけ許可する。
allowBuilds:
  esbuild: true
  workerd: true
  lightningcss: true
  msw: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
  # miniflare が undici 7.29.1 を exact pin しているため。CVE-2026-109869 /
  # CVE-2026-109924 修正版が miniflare に降りたら削除する。
  undici@7.29.1: 7.30.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
