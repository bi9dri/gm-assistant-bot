name: PR Preview

# `--temporary` は認証情報なしでデプロイでき、アカウントごと 60 分で失効するので
# 後始末の仕組みが要らない。
# 本番と同じ TanStack Start ビルドを上げ、`/api` はアプリ内 server route
# (src/routes/api/$.ts) が本番 API へ中継する。preview の origin は毎回変わるため
# 本番 API を直接叩くと CORS で弾かれる。
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-pr-${{ inputs.pr }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/head
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "v24.21.0"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter 'gm-assistant-bot-frontend' build
        env:
          # 同一オリジン (アプリ内 /api 中継) を使う。
          VITE_API_BASE_URL: ""
      - id: deploy
        working-directory: frontend
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          # ビルド生成 config (dist/server/wrangler.json) には本番 routes が入る。
          # 一時アカウントに zone は無いので外す。
          tmp="$(mktemp)"
          jq 'del(.routes)' dist/server/wrangler.json > "$tmp"
          mv "$tmp" dist/server/wrangler.json
          pnpm exec wrangler deploy \
            --name "gm-assistant-bot-preview-pr-${{ inputs.pr }}" --temporary | tee deploy.log
          echo "url=$(grep -oEm1 'https://[a-z0-9.-]+\.workers\.dev' deploy.log)" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ inputs.pr }}" --repo "$GITHUB_REPOSITORY" \
            --body "Preview: ${{ steps.deploy.outputs.url }} (commit $(git rev-parse --short HEAD) / 60 分で失効します)"
