name: Deploy Frontend

# frontend/ からの `wrangler deploy` は、`@cloudflare/vite-plugin` が生成した
# frontend/dist/server/wrangler.json (Worker + assets) へリダイレクトされる。
# 要リポジトリ Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID。
# カスタムドメイン (gm-assistant-bot.bidri.dev) は frontend/wrangler.jsonc の routes で付く。
on:
  push:
    branches: [main]
    paths: [frontend/**, package.json, pnpm-lock.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "v24.21.0"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter 'gm-assistant-bot-frontend' build
      - working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: pnpm exec wrangler deploy
