name: Deploy Frontend

# frontend/ からの `wrangler deploy` は、`@cloudflare/vite-plugin` が生成した
# frontend/dist/server/wrangler.json (Worker + assets) へリダイレクトされる。
# 要リポジトリ Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID。
# カスタムドメイン (gm-assistant-bot.bidri.dev) は frontend/wrangler.jsonc の routes で付く。
on:
  push:
    branches: [main]
    paths: [frontend/**, package.json, pnpm-lock.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.1"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter 'gm-assistant-bot-frontend' build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-slim
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.1"
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: pnpm exec wrangler deploy
