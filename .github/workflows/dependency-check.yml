name: Dependency Audit

# 毎日 07:00 JST。パッケージの更新提案は Renovate（renovate.yml）が担当し、
# こちらは Renovate がカバーしない脆弱性スキャン（推移的依存を含む）だけを行う。
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      # bun / osv-scanner のバージョンは devbox.json が単一の情報源。
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7  # v0.15.0
        with:
          devbox-version: 0.17.1
          enable-cache: true
      - run: devbox run -- bun audit
      - run: devbox run -- osv-scanner scan source -r .
