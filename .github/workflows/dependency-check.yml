name: Dependency Check

# 毎日 07:00 JST。npm パッケージ更新の判断は .claude/skills/update-dependencies
# に委ねる方針のため、このワークフローが自動 PR にするのは機械的に安全な
# GitHub Actions の SHA ピン更新（pinact）のみ。
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PINACT_BRANCH: chore/pinact
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      # bun のバージョンは package.json の packageManager から自動検出される。
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0

      # `pinact run --update --min-age 7` 相当。commit / push は自前で行うため skip_push。
      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a  # v3.0.0
        with:
          update: "true"
          min_age: "7"
          skip_push: "true"

      - name: pinact の差分を PR にする
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "GitHub Actions のピンは最新です" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo '```diff'; git diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore(deps): GitHub Actions のピンを更新 (pinact --min-age 7)'
          git push -f origin "HEAD:refs/heads/$PINACT_BRANCH"
          if [ -z "$(gh pr list --head "$PINACT_BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --head "$PINACT_BRANCH" --base "${{ github.ref_name }}" \
              --title 'chore(deps): GitHub Actions のピンを更新' \
              --body '`pinact run --update --min-age 7` による自動更新（7日以上経過したリリースのみ）。差分は SHA ピンとバージョンコメントのみ。'
          fi

      - name: ncu (npm パッケージの更新候補)
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          # --errorLevel 2: 更新候補があれば exit 1
          if bun run --bun ncu --errorLevel 2 > ncu.txt 2>&1; then
            cat ncu.txt >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat ncu.txt
          title='依存パッケージの更新候補 (ncu)'
          body=$(printf '`%s` の実行結果です。更新は `/update-dependencies` スキルの手順（triage → PR）で対応してください。\n\n```\n%s\n```\n' \
            'bun run --bun ncu' "$(cat ncu.txt)")
          num=$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # 脆弱性が見つかったらジョブを失敗させ、通知でエスカレーションする。
      - run: bun audit
      # scan-args の既定値は `--recursive ./`。upload-sarif は Code Scanning が
      # 有効な repo でのみ使えるため無効化し、失敗（fail-on-vuln 既定 true）で通知する。
      - uses: google/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
        with:
          upload-sarif: false
