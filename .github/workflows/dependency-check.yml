name: Dependency Check

# 毎日 07:00 JST。パッケージの更新提案は Renovate（GitHub App / .github/renovate.json5）
# が担当するため、ここでは Renovate がカバーしない脆弱性スキャンだけを行う。
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      # bun のバージョンは package.json の packageManager から自動検出される。
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - run: bun audit
      # scan-args の既定値は `--recursive ./`。upload-sarif は Code Scanning が
      # 有効な repo でのみ使えるため無効化し、失敗（fail-on-vuln 既定 true）で通知する。
      - uses: google/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
        with:
          upload-sarif: false
