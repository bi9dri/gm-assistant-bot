name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 意図した差分を `vrt:accepted` ラベルで承認できるようにするため labeled も拾う。
    types: [opened, synchronize, reopened, labeled]

# baseline の自動コミットが競合しないよう main の run は直列化する。PR は最新の push
# だけ検証すればよいので古い run を打ち切るが、labeled は打ち切らない (先行 run の
# check 結果が消え、生き残った run が check を skip するのを避ける)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24.22.0"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm fmt:check

  vrt:
    runs-on: ubuntu-latest
    # `gh pr view` / `gh pr edit` で承認ラベルを読み取り・消費する。
    # fork からの PR では token が read-only に降格されるため、承認フローは
    # 同一リポジトリのブランチにだけ適用する (下の acceptance step を参照)。
    permissions:
      contents: read
      pull-requests: write
    # ハングで長時間放置されるのを防ぐ安全網。
    timeout-minutes: 20
    outputs:
      # 重い step が実際に走ったか。vrt-baselines が artifact の有無を判断する。
      ran: ${{ steps.scope.outputs.run }}
    steps:
      # 意図した差分を承認する手段。`vrt:accepted` ラベルが付いた PR では比較を
      # スキップしてジョブを成功させる。検出と同時にラベルを消費するので、途中で
      # キャンセルされても承認が次のコミットに残らない。fork PR は token が
      # read-only でラベルを外せないため対象外。重い step より前に置くことで、
      # 承認済み run では install / build を走らせない。
      - id: acceptance
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          # checkout より前なので git remote から repo を推定できない。明示する。
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'vrt:accepted'; then
            gh pr edit "$PR_NUMBER" --remove-label vrt:accepted
            echo "accepted=true" >> "$GITHUB_OUTPUT"
          fi

      # 変更セットから「VRT を走らせるか / どのプロジェクトを走らせるか」を決める。
      # `vrt` は必須チェックなので workflow 側の paths フィルタは使えない (workflow が
      # 起動しないと check 自体が作られず pending のままマージを塞ぐ)。job は必ず起動し、
      # 重い step だけを間引く — skip された job は Success として扱われる。
      - id: scope
        if: steps.acceptance.outputs.accepted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # main への push は baseline 再生成が目的なので常に全プロジェクト。
          if [ "$EVENT" != "pull_request" ]; then
            printf 'run=true\nroutes=true\nstorybook=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 取得に失敗したときは安全側 (全プロジェクト実行) に倒す。
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' 2>/dev/null) || {
            printf 'run=true\nroutes=true\nstorybook=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }

          routes=false
          storybook=false
          while IFS= read -r file; do
            case "$file" in
              # story 側だけで完結する変更。route の screenshot は動かない。
              frontend/test/stories/* | frontend/test/vrt/storybook/* | frontend/.storybook/*)
                storybook=true
                ;;
              # Storybook の静的配信サーバは story 側の screenshot に効く。
              frontend/test/vrt/serve-storybook-static.ts)
                routes=true
                storybook=true
                ;;
              # route 側だけで完結する変更。story の screenshot は動かない。
              frontend/src/routes/* | frontend/test/vrt/*.ts)
                routes=true
                ;;
              # frontend の共通コード・依存・CI 設定はどちらにも効きうる。
              frontend/* | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .github/workflows/ci.yml)
                routes=true
                storybook=true
                ;;
            esac
          done <<< "$files"

          run=false
          if [ "$routes" = true ] || [ "$storybook" = true ]; then
            run=true
          fi

          projects=""
          if [ "$routes" = true ]; then
            projects="$projects --project=chromium-desktop-light --project=chromium-desktop-dark"
            projects="$projects --project=chromium-mobile-light --project=chromium-mobile-dark"
          fi
          if [ "$storybook" = true ]; then
            projects="$projects --project=chromium-storybook-light --project=chromium-storybook-dark"
          fi

          {
            echo "run=$run"
            echo "routes=$routes"
            echo "storybook=$storybook"
            echo "projects=$projects"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.acceptance.outputs.accepted != 'true' && steps.scope.outputs.run == 'true'
        with:
          # PR コードから GITHUB_TOKEN を読めないようにする (ラベル操作は上で env 渡し)。
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: steps.acceptance.outputs.accepted != 'true' && steps.scope.outputs.run == 'true'
        with:
          node-version: "24.22.0"
          cache: true
      - run: pnpm install --frozen-lockfile
        if: steps.acceptance.outputs.accepted != 'true' && steps.scope.outputs.run == 'true'
      # Cache Playwright browser binaries (~280MB chromium). Key on the resolved
      # @playwright/test version rather than the lockfile: every unrelated
      # dependency bump would otherwise miss and re-download the browser.
      # A key restored only via `restore-keys` sets cache-hit to "false", so the
      # install step still runs and fills in the new browser revision.
      - id: playwright-version
        if: steps.acceptance.outputs.accepted != 'true' && steps.scope.outputs.run == 'true'
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        if: steps.acceptance.outputs.accepted != 'true' && steps.scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - if: steps.acceptance.outputs.accepted != 'true' && steps.scope.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.acceptance.outputs.accepted != 'true' && steps.scope.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium
      # Storybook static build is required by the storybook-static webServer
      # in playwright.config.ts (chromium-storybook project reads index.json
      # from frontend/storybook-static/). route 側だけの変更では省く。
      - if: steps.acceptance.outputs.accepted != 'true' && steps.scope.outputs.run == 'true' && steps.scope.outputs.storybook == 'true'
        run: pnpm --filter gm-assistant-bot-frontend build-storybook

      - name: Compare against baselines
        if: >-
          github.event_name == 'pull_request' &&
          steps.acceptance.outputs.accepted != 'true' &&
          steps.scope.outputs.run == 'true'
        # `pnpm run <script> -- <flags>` は `--` をリテラルで渡してしまうため、
        # scope が選んだプロジェクトを exec で直接渡す。
        run: >-
          pnpm --filter gm-assistant-bot-frontend exec playwright test
          ${{ steps.scope.outputs.projects }}

      # main では差分を承認済みとして baseline を再生成する。生成物は vrt-baselines job がコミットする。
      - name: Refresh baselines
        if: github.event_name == 'push' && steps.scope.outputs.run == 'true'
        run: >-
          pnpm --filter gm-assistant-bot-frontend exec playwright test --update-snapshots
          ${{ steps.scope.outputs.projects }}

      - if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-diff
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload refreshed baselines
        if: github.event_name == 'push' && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-baselines
          path: frontend/test/vrt
          retention-days: 1
          if-no-files-found: error

  # main への push 時だけ、Linux で再生成した baseline を main にコミットする。
  # push は ruleset の bypass に登録した deploy key で行い、GITHUB_TOKEN は read のまま。
  vrt-baselines:
    needs: vrt
    # frontend に触れていない push では vrt が走らず artifact も無いので省く。
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.vrt.outputs.ran == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # ruleset の bypass (Always allow) に登録した deploy key。この job にだけ渡す。
          ssh-key: ${{ secrets.VRT_BASELINE_DEPLOY_KEY }}
      # 削除された story / route の baseline を残さないよう、既存の snapshot を
      # 一度消してから artifact を展開する (artifact は差分ではなく全体を持つ)。
      - name: Remove stale snapshots
        run: find frontend/test/vrt -type d -name '*-snapshots' -prune -exec rm -rf {} +
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vrt-baselines
          path: frontend/test/vrt
      # snapshot が空の artifact で全 baseline を消してコミットしないためのガード。
      - name: Verify baselines
        run: |
          if ! find frontend/test/vrt -type f -name '*.png' | grep -q .; then
            echo "No baseline PNGs in the artifact" >&2
            exit 1
          fi
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # artifact には test/vrt 配下のテストコードも含まれる。main が artifact 生成後に
          # 進んでいてもソースを巻き戻さないよう、snapshot だけをステージする
          # (削除された baseline も `-A` + pathspec で拾える)。
          git add -A -- ':(glob)frontend/test/vrt/**/*-snapshots/**'
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          # [skip ci] でこの push による CI の再帰実行を止める。
          git commit -m "chore(vrt): スクリーンショット baseline を更新 [skip ci]"
          # deploy key で push するため remote を SSH に切り替える。
          git remote set-url origin "git@github.com:${{ github.repository }}.git"
          git push origin HEAD:main
